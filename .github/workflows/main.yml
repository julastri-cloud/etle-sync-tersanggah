name: ETLE Sync Pelanggaran Tersanggah

on:
  # Pelanggaran Tersanggah - 4 kali sehari / setiap 6 jam
  # UTC 00:37, 06:37, 12:37, 18:37
  # WIB 07:37, 13:37, 19:37, 01:37
  schedule:
    - cron: '37 0,6,12,18 * * *'

  # Tetap bisa dijalankan manual
  workflow_dispatch:

jobs:
  run-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Playwright Browsers & System Dependencies
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Run ETLE Sync Script
        env:
          EMAIL_ETLE: ${{ secrets.EMAIL_ETLE }}
          PASSWORD_ETLE: ${{ secrets.PASSWORD_ETLE }}
          GCP_SA_KEY: ${{ secrets.GCP_SA_KEY }}
          WA_TARGET: ${{ secrets.WA_TARGET }}
          FONNTE_TOKEN: ${{ secrets.FONNTE_TOKEN }}
        run: python main.py
